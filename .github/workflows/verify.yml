name: Verify plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate manifest
        run: node -e "const p=require('./package.json');if(!p.dsh||!p.dsh.bundle)throw new Error('dsh.bundle missing');console.log('ok',p.name,p.version)"
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: No foreign runtime imports
        run: node scripts/check-imports.mjs